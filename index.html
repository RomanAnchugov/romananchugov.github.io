<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RomanAn — мобильная разработка под ключ</title>
<meta name="description" content="Роман Анчугов — мобильный разработчик полного цикла. Приложения под ключ для iOS и Android, ТЗ для бизнеса, AI-assisted разработка.">
<meta name="theme-color" content="#faf8f4">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..800&family=Golos+Text:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- ПРАВИЛО: поменял styles.css / data.js / main.js / favicon.png — подними ?v=N на единицу во всех ссылках ниже, иначе у пользователей останется старый кэш -->
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo" role="img" aria-label="Roman Anchugov">
      <span class="logo-sizer" aria-hidden="true">Roman Anchugov</span><span class="logo-live" aria-hidden="true"><span class="logo-plain">Roman&nbsp;</span><span id="logoTyped">Anchugov</span><span class="logo-caret"></span></span>
    </div>
    <nav class="links" id="navLinks"></nav>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow-row"><span class="status-dot"></span><span id="heroEyebrow"></span></div>
      <h1 class="headline" id="heroHeadline"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-cta" id="heroCta"></div>
    </div>
    <div class="terminal">
      <div class="term-bar"><i></i><i></i><i></i></div>
      <div class="term-body" id="termBody"></div>
    </div>
  </div>
  <div class="scroll-cue"><div class="bar"></div> вниз</div>
</section>

<!-- ============ SERVICES ============ -->
<section id="services">
  <div class="wrap">
    <div class="section-head reveal">
      <h2 class="section-title" id="servicesTitle"></h2>
      <span class="section-index" id="servicesNote"></span>
    </div>
    <div class="services" id="servicesList"></div>
  </div>
</section>

<!-- ============ WHY ============ -->
<section id="why">
  <div class="wrap">
    <div class="why reveal">
      <div class="section-head why-head">
        <h2 class="section-title" id="whyTitle"></h2>
        <span class="section-index" id="whyNote"></span>
      </div>
      <div class="why-grid">
        <p class="why-lead" id="whyLead"></p>
        <div class="why-points" id="whyList"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ EXPERIENCE ============ -->
<section id="experience">
  <div class="wrap">
    <div class="section-head reveal">
      <h2 class="section-title" id="expTitle"></h2>
      <span class="section-index" id="expNote"></span>
    </div>
    <div class="timeline">
      <div class="timeline-track" id="timelineList"></div>
    </div>
    <p class="editnote" id="editnote"></p>
  </div>
</section>

<!-- ============ CONTACT ============ -->
<section id="contact">
  <div class="wrap">
    <div class="contact-inner reveal">
      <div class="contact-title" id="contactTitle"></div>
      <div class="contact-list" id="contactList"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-row">
    <span id="footLeft"></span>
    <span id="footRight"></span>
  </div>
</footer>

<script src="js/data.js?v=5"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
